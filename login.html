<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Rich Schools</title>
  <meta name="description" content="Administrator portal login for Rich Schools consultancy blog dashboard.">
  <link rel="stylesheet" href="index.css">
  <style>
    .login-container {
      max-width: 450px;
      margin: 6rem auto;
      padding: 3rem;
      border-radius: var(--radius-md);
    }
    .error-banner {
      background-color: rgba(229, 62, 62, 0.15);
      border: 1px solid hsl(0, 75%, 60%);
      color: hsl(0, 75%, 40%);
      padding: 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Premium Header / Navbar -->
  <header class="glass">
    <div class="header-container">
      <a href="index.html" class="logo" id="logoLink">
        <div class="logo-icon">🎓</div>
        <div class="logo-text">
          Rich Schools
          <span>UK Educational Consultancy</span>
        </div>
      </a>
      <div class="header-right">
        <a href="index.html" class="btn btn-secondary" style="padding: 0.5rem 1.2rem; min-block-size: auto;">Main Site</a>
      </div>
    </div>
  </header>

  <main style="display: flex; align-items: center; min-height: calc(80vh - var(--header-height));">
    <div class="login-container glass" id="loginCard">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Admin Dashboard</h2>
      <p style="margin-bottom: 2.5rem; text-align: center;">Please authenticate to access the blog management system.</p>
      
      <div class="error-banner" id="errorBanner"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="E.g., administrator@richschools.co.uk" required>
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginSubmitBtn">Sign In</button>

        <div style="text-align: center; margin: 1.5rem 0; color: var(--color-text-muted); position: relative;">
          <span style="background: var(--color-bg); padding: 0 1rem; position: relative; z-index: 2; font-size: 0.9rem;">or</span>
          <hr style="position: absolute; top: 50%; left: 0; width: 100%; border: none; border-top: 1px solid var(--color-border); margin: 0; z-index: 1;">
        </div>

        <button type="button" class="btn btn-secondary" id="googleLoginBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google Logo">
          Sign in with Google
        </button>
      </form>
    </div>
  </main>

  <!-- Static Firebase Compat SDK imports for file:// compatibility -->
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    // Read global config
    const config = window.firebaseConfig;
    
    // Initialize Firebase
    let auth = null;
    if (config && config.apiKey && config.apiKey !== "YOUR_API_KEY") {
      try {
        const app = firebase.initializeApp(config);
        auth = firebase.auth(app);
      } catch (err) {
        console.error("Firebase init failed: ", err);
        showError("Firebase configuration failed to load. Please verify config.");
      }
    } else {
      showError("Firebase config is unpopulated. Please configure firebase-config.js first.");
    }

    const loginForm = document.getElementById('loginForm');
    const errorBanner = document.getElementById('errorBanner');
    const submitBtn = document.getElementById('loginSubmitBtn');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    function clearError() {
      errorBanner.textContent = '';
      errorBanner.style.display = 'none';
    }

    // Check if session is already active
    if (auth) {
      auth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = 'admin.html';
        }
      });
    }

    // Form Submission
    if (loginForm && auth) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        clearError();

        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;

        if (!email || !pass) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        auth.signInWithEmailAndPassword(email, pass)
          .then((userCredential) => {
            window.location.href = 'admin.html';
          })
          .catch((error) => {
            console.error("Authentication error:", error);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
            
            let prettyMsg = "Authentication failed. Please check credentials.";
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
              prettyMsg = "Invalid email address or password.";
            } else if (error.code === 'auth/invalid-credential') {
              prettyMsg = "Incorrect email address or password.";
            } else if (error.code === 'auth/too-many-requests') {
              prettyMsg = "Account temporarily locked due to excessive failed attempts. Please try later.";
            }
            showError(prettyMsg);
          });
      });
    }

    // Google Sign-In handler
    const googleBtn = document.getElementById('googleLoginBtn');
    if (googleBtn && auth) {
      googleBtn.addEventListener('click', () => {
        clearError();
        const provider = new firebase.auth.GoogleAuthProvider();
        googleBtn.disabled = true;
        googleBtn.innerHTML = 'Connecting to Google...';

        auth.signInWithPopup(provider)
          .then((result) => {
            window.location.href = 'admin.html';
          })
          .catch((error) => {
            console.error("Google sign-in error:", error);
            googleBtn.disabled = false;
            googleBtn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google Logo"> Sign in with Google';
            
            let prettyMsg = "Google authentication failed. Please try again.";
            if (error.code === 'auth/popup-closed-by-user') {
              prettyMsg = "Login popup was closed before completion.";
            } else if (error.code === 'auth/operation-not-allowed') {
              prettyMsg = "Google sign-in is not enabled in your Firebase Authentication console.";
            }
            showError(prettyMsg);
          });
      });
    }
  </script>
</body>
</html>
